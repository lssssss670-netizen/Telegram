name: Build JikJik APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply JikJik files
        run: |
          if [ -f jikjik_project_files.zip ]; then
            # remove old launcher icons (any extension) to avoid duplicate-resource errors
            find TMessagesProj/src/main/res -path '*mipmap*' \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
            unzip -o jikjik_project_files.zip
          else
            echo "jikjik_project_files.zip not found in repo root"; exit 1
          fi

      - name: Rebrand (JikJik names, colors, logos)
        run: |
          pip install pillow > /dev/null
          python3 tools/rebrand.py

      - name: Connect app to the JikJik API (login screen, requests, sync)
        run: python3 tools/patch_core.py

      - name: Verify JikJik TL update import
        shell: bash
        run: |
          SYNC=TMessagesProj/src/main/java/org/telegram/messenger/jik/JikSync.java
          grep -Fqx 'import org.telegram.tgnet.tl.TL_update;' "$SYNC"
          if grep -Fq 'import org.telegram.tgnet.TL_update;' "$SYNC"; then
            echo 'Incorrect TL_update package import found in JikSync.java'
            exit 1
          fi

      - name: Build only arm64 (faster, ~12 min instead of ~45)
        run: |
          grep -rl --include=build.gradle 'abiFilters' . | xargs sed -i -E 's/abiFilters[[:space:]]+.*/abiFilters "arm64-v8a"/'
          grep -rn --include=build.gradle 'abiFilters' . || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK / CMake (preinstalled SDK of the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore native build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: native-arm64-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/CMakeLists.txt') }}
          restore-keys: |
            native-arm64-

      - name: Freeze native source timestamps (keeps cached objects valid)
        run: find TMessagesProj/jni -type f -exec touch -d '2001-01-01 00:00:00' {} + || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace -Pandroid.injected.build.abi=arm64-v8a

      - name: Save native build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: native-arm64-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/CMakeLists.txt') }}-${{ github.run_id }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jikjik-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
