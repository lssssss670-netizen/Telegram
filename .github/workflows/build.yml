name: Build JikJik APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply JikJik files
        run: |
          if [ -f jikjik_project_files.zip ]; then
            # remove old launcher icons (any extension) to avoid duplicate-resource errors
            find TMessagesProj/src/main/res -path '*mipmap*' \( -name 'ic_launcher.*' -o -name 'ic_launcher_round.*' \) -delete
            unzip -o jikjik_project_files.zip
          else
            echo "jikjik_project_files.zip not found in repo root"; exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK / CMake (preinstalled SDK of the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jikjik-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
