name: Build JikJik APK

# سه حالت اجرا:
#  1) هر Push روی مخزن
#  2) دکمهٔ Run workflow در تب Actions
#  3) فایل ZIP پروژه را در ریشهٔ مخزن بگذارید؛ همین Workflow آن را استخراج و بیلد می‌کند
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (extract ZIP if needed)
        id: proj
        shell: bash
        run: |
          set -e
          ROOT=""
          # اگر پروژه مستقیم در مخزن باشد
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="."
          else
            # در غیر این صورت اولین ZIP مخزن را استخراج می‌کنیم
            ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No project found. Put the project .zip (or the extracted project) in the repository."
              exit 1
            fi
            echo "Extracting: $ZIP"
            rm -rf "$RUNNER_TEMP/proj" && mkdir -p "$RUNNER_TEMP/proj"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
            S=$(find "$RUNNER_TEMP/proj" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$S" ]; then
              echo "::error::settings.gradle not found inside the zip."
              exit 1
            fi
            ROOT=$(dirname "$S")
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # پروژه Gradle Wrapper ندارد؛ نسخهٔ سازگار با AGP 8.6.1 نصب می‌شود
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.root }}
        shell: bash
        run: |
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleDebug --stacktrace
          else gradle --no-daemon assembleDebug --stacktrace; fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find "${{ steps.proj.outputs.root }}" -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -la "$GITHUB_WORKSPACE/apk-out"
          test -n "$(ls -A "$GITHUB_WORKSPACE/apk-out")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JikJik-APK
          path: apk-out/*.apk
          if-no-files-found: error
